<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amazon Price Calculator</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:#f0f2f5; padding:20px; color:#232f3e; }
  .container { max-width:1100px; margin:0 auto; padding-bottom:40px; }
  h1 { text-align:center; margin-bottom:8px; color:#ff9900; }
  .subtitle { text-align:center; color:#666; margin-bottom:24px; font-size:14px; }
  .card { background:#fff; border-radius:10px; padding:24px; margin-bottom:20px;
          box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .card h2 { font-size:18px; margin-bottom:16px; padding-bottom:10px;
             border-bottom:2px solid #ff9900; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:800px){ .grid { grid-template-columns:1fr; } }
  label { display:block; font-size:13px; color:#555; margin-bottom:4px; }
  input, select { width:100%; padding:10px; border:1px solid #ddd; border-radius:6px;
                  font-size:14px; margin-bottom:14px; }
  input:focus, select:focus { outline:none; border-color:#ff9900; }
  .unit { color:#999; font-size:12px; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  button { width:100%; padding:14px; background:#ff9900; color:#fff; border:none;
           border-radius:8px; font-size:16px; font-weight:bold; cursor:pointer; }
  button:hover { background:#e88b00; }
  .freight-panel { background:linear-gradient(135deg,#232f3e,#37475a); color:#fff; }
  .freight-panel h2 { color:#ff9900; border-color:#ff9900; }
  .freight-panel label { color:#b0bec5; }
  .freight-panel input, .freight-panel select { background:#2c3a49; color:#fff;
           border-color:#4a5a6a; }
  .rate-info { font-size:12px; color:#8a97a8; margin-top:10px; line-height:1.7; }
  .freight-output { background:#1a2530; border-radius:8px; padding:14px; margin-top:10px;
                    font-size:13px; line-height:1.9; min-height:60px; }
  .freight-output b { color:#2ecc71; font-size:16px; }
  .btn-apply { background:#2ecc71; padding:10px; font-size:13px; margin-top:10px; }
  .btn-apply:hover { background:#27ae60; }
  .btn-edit { background:#4a5a6a; padding:10px; font-size:13px; margin-top:6px; }
  .btn-edit:hover { background:#5d7086; }
  .toast { background:#2ecc71; color:#fff; border-radius:8px; padding:10px 14px;
           margin-top:10px; font-size:13px; display:none; }
  .result { background:#232f3e; color:#fff; }
  .result h2 { color:#ff9900; border-color:#ff9900; }
  .result-row { display:flex; justify-content:space-between; padding:10px 0;
                border-bottom:1px dashed #37475a; font-size:14px; }
  .result-row.total { font-size:18px; font-weight:bold; color:#ff9900; border-bottom:none; }
  .green { color:#2ecc71; }
  .note { font-size:12px; color:#8a97a8; margin-top:12px; line-height:1.6; }
  .err { background:#fce8e6; border:1px solid #e74c3c; color:#c0392b; border-radius:8px;
         padding:10px 14px; margin-bottom:14px; font-size:13px; display:none; }

  /* 弹窗 */
  .modal-mask { position:fixed; top:0; left:0; width:100%; height:100%;
                background:rgba(0,0,0,.55); z-index:999;
                display:none; align-items:center; justify-content:center; padding:16px; }
  .modal { background:#fff; border-radius:12px; width:100%; max-width:520px;
           padding:24px; box-shadow:0 10px 40px rgba(0,0,0,.3);
           animation:popIn .2s ease; }
  @keyframes popIn { from{ transform:scale(.92); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .modal h2 { font-size:18px; margin-bottom:6px; color:#232f3e;
              padding-bottom:10px; border-bottom:2px solid #ff9900; }
  .modal .tip { font-size:13px; color:#666; margin-bottom:14px; }

  /* 结果刷新时的闪烁动画 */
  .flash { animation:flashAnim .4s ease; }
  @keyframes flashAnim { 0%{ background:#3a4a5a; } 100%{ background:transparent; } }
</style>
</head>
<body>
<div class="container">
  <h1>亚马逊产品价格计算器</h1>
  <p class="subtitle">单位：美元（USD） · FBA / FBM 分开计算 · 盐田港 → 美国运费自动估算</p>

  <!-- 运费自动估算 -->
  <div class="card freight-panel">
    <h2>头程运费估算（深圳盐田港 → 美国）</h2>
    <div class="row">
      <div>
        <label>本批货物总重量 (kg)</label>
        <input type="number" id="batchWeight" step="any" min="0" value="100"
               onchange="estimateFreight()" oninput="estimateFreight()">
      </div>
      <div>
        <label>本批货物件数</label>
        <input type="number" id="batchQty" step="1" min="1" value="200"
               onchange="estimateFreight()" oninput="estimateFreight()">
      </div>
      <div>
        <label>运输方式</label>
        <select id="shipMethod" onchange="estimateFreight()">
          <option value="sea_slow">海运普船 25-35天</option>
          <option value="sea_fast" selected>海运快船(美森) 12-18天</option>
          <option value="air">空派 8-12天</option>
          <option value="express">国际快递 5-7天</option>
        </select>
      </div>
      <div>
        <label>目的仓</label>
        <select id="destination" onchange="estimateFreight()">
          <option value="west" selected>美西</option>
          <option value="east">美东</option>
        </select>
      </div>
    </div>
    <div class="freight-output" id="freightOutput"></div>
    <button class="btn-apply" onclick="applyFreight()">应用为头程运费</button>
    <button class="btn-edit" onclick="editRates()">修改费率表（弹窗编辑，存入本地）</button>
    <div class="toast" id="toast"></div>
    <p class="rate-info" id="rateInfo"></p>
  </div>

  <!-- 基础信息 -->
  <div class="card">
    <h2>1. 基础成本（FBA / FBM 共用）</h2>
    <div class="row">
      <div>
        <label>产品制造成本 ($) *</label>
        <input type="number" id="cost" step="any" min="0" placeholder="例如 5.00"
               oninput="autoCalc()">
      </div>
      <div>
        <label>头程运费/件 ($) <span class="unit">自动估算，可手动改</span></label>
        <input type="number" id="shippingIn" step="any" min="0" value="0.90"
               oninput="this.dataset.manual=1; autoCalc();">
      </div>
    </div>
    <div class="row">
      <div>
        <label>平台佣金比例 (%) <span class="unit">一般 8%~15%</span></label>
        <input type="number" id="referralFee" step="any" min="0" value="15"
               oninput="autoCalc()">
      </div>
      <div>
        <label>其他费用（广告/退货损耗等）($)</label>
        <input type="number" id="other" step="any" min="0" value="0"
               oninput="autoCalc()">
      </div>
    </div>
  </div>

  <!-- FBA / FBM 参数 -->
  <div class="grid">
    <div class="card">
      <h2>2. FBA 参数</h2>
      <label>产品尺寸分段</label>
      <select id="fbaSize"
        onchange="document.getElementById('customFbaWrap').style.display=(this.value=='custom'?'block':'none'); autoCalc();">
        <option value="2.5">小号标准尺寸 ($2.50)</option>
        <option value="3" selected>大号标准尺寸 ≤1磅 ($3.00)</option>
        <option value="4.5">大号标准尺寸 1-3磅 ($4.50)</option>
        <option value="7">大号标准尺寸 3-20磅 ($7.00)</option>
        <option value="custom">自定义配送费</option>
      </select>
      <div id="customFbaWrap" style="display:none">
        <label>自定义 FBA 配送费 ($)</label>
        <input type="number" id="customFba" step="any" min="0" value="3"
               oninput="autoCalc()">
      </div>
      <label>月度仓储费 ($)</label>
      <input type="number" id="storageFee" step="any" min="0" value="0.5"
             oninput="autoCalc()">
    </div>
    <div class="card">
      <h2>2. FBM 参数</h2>
      <label>自发货运费（美国境内尾程）($)</label>
      <input type="number" id="fbmShipping" step="any" min="0" value="5"
             oninput="autoCalc()">
      <label>包装/人工成本 ($)</label>
      <input type="number" id="fbmPacking" step="any" min="0" value="1"
             oninput="autoCalc()">
    </div>
  </div>

  <!-- 目标利润 -->
  <div class="card">
    <h2>3. 目标利润率</h2>
    <div class="err" id="errBox"></div>
    <div class="row">
      <div>
        <label>建议售价利润率 (%) <span class="unit">一般 20%~40%</span></label>
        <input type="number" id="margin" step="1" min="1" max="90" value="30"
               oninput="autoCalc()">
      </div>
      <div style="display:flex; align-items:flex-end;">
        <button onclick="calc()">开始计算</button>
      </div>
    </div>
  </div>

  <!-- 结果 -->
  <div class="grid">
    <div class="card result" id="fbaResult" style="display:none">
      <h2>FBA 计算结果</h2>
      <div class="result-row"><span>到仓成本（制造+头程）</span><span id="fbaLanded"></span></div>
      <div class="result-row"><span>FBA配送费 + 仓储费</span><span id="fbaFee"></span></div>
      <div class="result-row"><span>平台佣金 + 其他</span><span id="fbaExtra"></span></div>
      <div class="result-row"><span>总成本</span><span id="fbaTotal"></span></div>
      <div class="result-row total"><span>推荐上架价格</span><span id="fbaPrice"></span></div>
      <div class="result-row"><span>预计单件利润</span><span class="green" id="fbaProfit"></span></div>
    </div>
    <div class="card result" id="fbmResult" style="display:none">
      <h2>FBM 计算结果</h2>
      <div class="result-row"><span>到仓成本（制造+头程）</span><span id="fbmLanded"></span></div>
      <div class="result-row"><span>自发货运费 + 包装</span><span id="fbmFee"></span></div>
      <div class="result-row"><span>平台佣金 + 其他</span><span id="fbmExtra"></span></div>
      <div class="result-row"><span>总成本</span><span id="fbmTotal"></span></div>
      <div class="result-row total"><span>推荐上架价格</span><span id="fbmPrice"></span></div>
      <div class="result-row"><span>预计单件利润</span><span class="green" id="fbmProfit"></span></div>
      <p class="note">FBM 若做免邮，运费已含在成本里。</p>
    </div>
  </div>
</div>

<!-- 费率编辑弹窗 -->
<div class="modal-mask" id="rateEditor" onclick="if(event.target===this)closeRateEditor()">
  <div class="modal">
    <h2>⚙️ 修改费率</h2>
    <p class="tip" id="rateEditTitle"></p>
    <label>美西单价 ($/kg)</label>
    <input type="number" id="editWest" step="0.01" min="0">
    <label>美东单价 ($/kg)</label>
    <input type="number" id="editEast" step="0.01" min="0">
    <label>最小起运量 (kg)</label>
    <input type="number" id="editMinKg" step="0.1" min="0">
    <div class="row">
      <div><button class="btn-apply" onclick="saveEditedRates()">保存并应用</button></div>
      <div><button style="background:#95a5a6" onclick="closeRateEditor()">取消</button></div>
    </div>
  </div>
</div>

<script>
var DEFAULT_RATES = {
  date: "2024-Q3",
  sea_slow:  { west: 1.1, east: 1.6,  minKg: 12,  name: "海运普船" },
  sea_fast:  { west: 1.8, east: 2.4,  minKg: 12,  name: "海运快船(美森)" },
  air:       { west: 4.5, east: 5.2,  minKg: 0.5, name: "空派" },
  express:   { west: 7.5, east: 8.5,  minKg: 0.5, name: "国际快递" }
};
var currentRates = null;
var rateSource = "";

function getSavedRates(){
  try { return localStorage.getItem("freightRates"); } catch(e){ return null; }
}
function saveRates(){
  try { localStorage.setItem("freightRates", JSON.stringify(currentRates)); } catch(e){}
}
function v(id){ return parseFloat(document.getElementById(id).value) || 0; }
function money(n){ return "$" + n.toFixed(2); }

function loadRates(){
  var parsed = null;
  try { parsed = JSON.parse(getSavedRates()); } catch(e){ parsed = null; }
  if(parsed){
    currentRates = parsed;
    rateSource = "本地保存的自定义费率（" + parsed.date + "）";
  }else{
    currentRates = JSON.parse(JSON.stringify(DEFAULT_RATES));
    rateSource = "内置参考费率（" + currentRates.date + "）";
  }
  estimateFreight();
}

/* ---------- 运费估算 ---------- */
function estimateFreight(){
  if(!currentRates){ return; }
  var totalW = v("batchWeight");
  var qty = Math.max(1, v("batchQty"));
  var method = document.getElementById("shipMethod").value;
  var dest = document.getElementById("destination").value;
  var r = currentRates[method];
  if(!r){ return; }
  var ratePerKg = r[dest];
  var effWeight = Math.max(totalW, r.minKg);
  var batchTotal = effWeight * ratePerKg;
  var perItem = batchTotal / qty;
  var singleKg = totalW / qty;
  var html;
  if(totalW > 0){
    html = r.name + " · " + (dest==="west" ? "美西" : "美东") + "仓"
      + " · 单价 <b>$" + ratePerKg + "/kg</b><br>"
      + "单件重量：" + singleKg.toFixed(3) + " kg"
      + " ｜ 计费重量：" + effWeight + "kg"
      + (effWeight > totalW ? "（未达最小起运量" + r.minKg + "kg，按起运量计）" : "")
      + "<br>整批运费：$" + batchTotal.toFixed(2)
      + " ÷ " + qty + "件"
      + " = 单件分摊 <b>$" + perItem.toFixed(2) + "</b>";
  }else{
    html = "请输入本批货物总重量";
  }
  document.getElementById("freightOutput").innerHTML = html;
  document.getElementById("rateInfo").innerHTML =
    "费率来源：" + rateSource
    + "<br>提示：海运旺季(8-10月)可能上涨30%~80%，建议定期向货代询价。";
  var sInput = document.getElementById("shippingIn");
  if(!sInput.dataset.manual && totalW > 0){
    sInput.value = perItem.toFixed(2);
  }
  /* 运费变了 → 联动重算结果 */
  autoCalc();
}

/* ---------- 提示条 ---------- */
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.style.display = "block";
  setTimeout(function(){ t.style.display = "none"; }, 3000);
}

function applyFreight(){
  var sInput = document.getElementById("shippingIn");
  sInput.dataset.manual = 1;
  showToast("已应用头程运费 $" + sInput.value + "/件");
  autoCalc();
}

/* ---------- 费率编辑弹窗 ---------- */
function editRates(){
  var m = document.getElementById("shipMethod").value;
  var r = currentRates[m];
  document.getElementById("rateEditTitle").textContent =
    "当前编辑：" + r.name + "（保存后存入浏览器本地，下次打开自动使用）";
  document.getElementById("editWest").value = r.west;
  document.getElementById("editEast").value = r.east;
  document.getElementById("editMinKg").value = r.minKg;
  document.getElementById("rateEditor").style.display = "flex";
}
function saveEditedRates(){
  var m = document.getElementById("shipMethod").value;
  var r = currentRates[m];
  r.west  = v("editWest")  || r.west;
  r.east  = v("editEast")  || r.east;
  r.minKg = v("editMinKg") || r.minKg;
  currentRates.date = "自定义 " + new Date().toLocaleDateString();
  saveRates();
  rateSource = "本地保存的自定义费率（" + currentRates.date + "）";
  estimateFreight();   // 里面会自动 autoCalc()
  closeRateEditor();
  showToast("费率已保存并重新估算");
}
function closeRateEditor(){
  document.getElementById("rateEditor").style.display = "none";
}
document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){ closeRateEditor(); }
});

/* ---------- 自动重算：只在结果已展示过 + 成本有效时静默执行 ---------- */
function autoCalc(){
  var shown = document.getElementById("fbaResult").style.display !== "none";
  if(!shown){ return; }
  calc(true);
}

/* ---------- 价格计算 ---------- */
function roundTo99(p){ return Math.floor(p) + 0.99; }

function showErr(msg){
  var e = document.getElementById("errBox");
  e.textContent = msg;
  e.style.display = "block";
}

function flash(id){
  var el = document.getElementById(id);
  el.className = el.className.replace(/ ?flash/g, "");
  void el.offsetWidth;           // 触发动画重放
  el.className += " flash";
}

function calc(silent){
  document.getElementById("errBox").style.display = "none";
  var cost = v("cost");
  if(cost <= 0){
    if(!silent){ showErr("请先输入产品制造成本"); }
    return;
  }
  var referralRate = v("referralFee") / 100;
  var other = v("other");
  var margin = v("margin") / 100;
  if(margin + referralRate >= 0.98){
    if(!silent){ showErr("利润率 + 佣金比例过高，无法计算合理售价"); }
    return;
  }
  var landed = cost + v("shippingIn");

  // FBA
  var fbaShip = document.getElementById("fbaSize").value === "custom"
                ? v("customFba") : parseFloat(document.getElementById("fbaSize").value);
  var fbaFixed = landed + fbaShip + v("storageFee") + other;
  var fbaPrice = roundTo99(fbaFixed / (1 - referralRate - margin));
  var fbaRef = fbaPrice * referralRate;
  var fbaTotal = fbaFixed + fbaRef;
  var fbaProfit = fbaPrice - fbaTotal;
  document.getElementById("fbaLanded").textContent = money(landed);
  document.getElementById("fbaFee").textContent = money(fbaShip + v("storageFee"));
  document.getElementById("fbaExtra").textContent = money(fbaRef + other);
  document.getElementById("fbaTotal").textContent = money(fbaTotal);
  document.getElementById("fbaPrice").textContent = money(fbaPrice);
  document.getElementById("fbaProfit").textContent =
    money(fbaProfit) + " (" + (fbaProfit / fbaPrice * 100).toFixed(1) + "%)";
  document.getElementById("fbaResult").style.display = "block";

  // FBM
  var fbmFixed = landed + v("fbmShipping") + v("fbmPacking") + other;
  var fbmPrice = roundTo99(fbmFixed / (1 - referralRate - margin));
  var fbmRef = fbmPrice * referralRate;
  var fbmTotal = fbmFixed + fbmRef;
  var fbmProfit = fbmPrice - fbmTotal;
  document.getElementById("fbmLanded").textContent = money(landed);
  document.getElementById("fbmFee").textContent = money(v("fbmShipping") + v("fbmPacking"));
  document.getElementById("fbmExtra").textContent = money(fbmRef + other);
  document.getElementById("fbmTotal").textContent = money(fbmTotal);
  document.getElementById("fbmPrice").textContent = money(fbmPrice);
  document.getElementById("fbmProfit").textContent =
    money(fbmProfit) + " (" + (fbmProfit / fbmPrice * 100).toFixed(1) + "%)";
  document.getElementById("fbmResult").style.display = "block";

  // 自动重算时，关键数字闪烁提示，让你一眼看到变化
  if(silent){
    flash("fbaPrice"); flash("fbmPrice");
    flash("fbaProfit"); flash("fbmProfit");
  }else{
    try { document.getElementById("fbaResult").scrollIntoView({behavior:"smooth"}); } catch(e){}
  }
}

loadRates();
</script>
</body>
</html>
